name: Deploy Vue Frontend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        env:
          EC2_USER: root
          EC2_HOST: 217.216.110.171
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > private_key.pem
          chmod 600 private_key.pem
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -i private_key.pem $EC2_USER@$EC2_HOST << 'EOF'
            export CI=true
            cd /var/www/money-manager-web-frontend
            chown -R openclaw:openclaw /var/www/money-manager-web-frontend
            sudo -u openclaw -- sh -lc '
              cd /var/www/money-manager-web-frontend &&
              git fetch origin &&
              git reset --hard origin/main &&
              npm install --no-audit --no-fund &&
              npm run build
            '
            systemctl reload nginx
          EOF
